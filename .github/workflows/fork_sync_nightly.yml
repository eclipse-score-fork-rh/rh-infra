    with:
      upstream_repo: eclipse-score/persistency
      upstream_ref: main
      target_repo: eclipse-score-fork-rh/persistency
      target_ref: main
    secrets:
      GIT_SYNC_SSH_KEY: ${{ secrets.GIT_SYNC_SSH_KEY }}
  
  sync-reference_integration-main:
    uses: ./.github/workflows/fork_sync.yml
    with:
      upstream_repo: eclipse-score/reference_integration
      upstream_ref: main
      target_repo: eclipse-score-fork-rh/reference_integration
      target_ref: main
    secrets:
      GIT_SYNC_SSH_KEY: ${{ secrets.GIT_SYNC_SSH_KEY }}

  sync-process_description-main:
    uses: ./.github/workflows/fork_sync.yml
    with:
      upstream_repo: eclipse-score/process_description
      upstream_ref: main

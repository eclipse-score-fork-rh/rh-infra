    secrets:
      GIT_SYNC_SSH_KEY: ${{ secrets.GIT_SYNC_SSH_KEY }}

  sync-tooling-main:
    uses: ./.github/workflows/fork_sync.yml
    with:
      upstream_repo: eclipse-score/tooling
      upstream_ref: main
      target_repo: eclipse-score-fork-rh/tooling
      target_ref: main
    secrets:
      GIT_SYNC_SSH_KEY: ${{ secrets.GIT_SYNC_SSH_KEY }}

  sync-itf-main:
